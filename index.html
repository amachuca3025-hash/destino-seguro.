<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0879dc">
<title>Destino Seguro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eaf3ff;color:#17365c}.app{max-width:750px;margin:auto;min-height:100vh;background:white}header{background:linear-gradient(135deg,#075fba,#168fe8);color:white;text-align:center;padding:22px 10px}.logo-svg{display:block;width:104px;height:104px;margin:0 auto 8px;filter:drop-shadow(0 5px 7px #003c7855)}header h1,header p{margin:6px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px}button,select{padding:12px;border:0;border-radius:10px;background:#e0efff;color:#123b68;font-size:14px;font-weight:bold}button{cursor:pointer}button:hover{background:#c4e1ff}main{padding:16px}.hero{background:linear-gradient(135deg,#e5f3ff,#f4f9ff);border-radius:18px;padding:20px;margin-bottom:22px}.hero h2{font-size:26px;margin:10px 0}.eyebrow{font-size:11px;letter-spacing:1px;font-weight:bold;color:#0879dc}.principal{background:#0879dc;color:white;margin:8px 0}.tarjetas-inicio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.acceso{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:7px;border:1px solid #dceafa;background:#fff;padding:15px;min-height:120px}.acceso span{font-size:25px}.acceso small{font-weight:normal;color:#526982;line-height:1.4}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#5d7188;font-size:14px}#mapaCanvas{width:100%;height:auto;border:2px solid #d4e5f7;border-radius:14px;background:#edf5e9;touch-action:manipulation}.legend{display:flex;flex-wrap:wrap;gap:10px;padding:12px;background:#f3f8ff;border-radius:12px;font-size:12px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:11px;height:11px;border-radius:50%;display:inline-block}.green{background:#179c59}.red{background:#dc3d46}.blue{background:#2378dc}.yellow{background:#e5a800}.tarjeta{padding:13px;border-radius:10px;margin:10px 0;background:#f0f6ff}.verde{border-left:6px solid #20a45b}.rojo{border-left:6px solid #e04444}.azul{border-left:6px solid #1678db}.amarillo{border-left:6px solid #f0b323}.tarjeta p{margin-bottom:0;line-height:1.5}.controles{display:grid;gap:10px;margin:12px 0}.controles select,.controles button{width:100%}.secondary{background:#fce9e9;color:#8b2222}.notice{background:#fff2cc;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;margin:16px 0}footer{text-align:center;padding:20px 10px;font-size:12px;color:#526982}@media(max-width:400px){.hero h2{font-size:22px}}
</style>
</head>
<body><div class="app">
<header><svg class="logo-svg" viewBox="0 0 160 160" role="img" aria-label="Logotipo Destino Seguro">
<path d="M80 7 L140 30 V72 C140 111 115 137 80 153 C45 137 20 111 20 72 V30 Z" fill="#fff"/>
<path d="M80 15 L132 35 V72 C132 106 111 128 80 143 C49 128 28 106 28 72 V35 Z" fill="#0b3d78"/>
<path d="M80 24 L124 41 V72 C124 100 105 120 80 133 C55 120 36 100 36 72 V41 Z" fill="#fff"/>
<circle cx="80" cy="53" r="13" fill="#ffc928"/>
<g stroke="#ffc928" stroke-width="4" stroke-linecap="round"><path d="M80 31v-7 M61 37l-5-6 M99 37l5-6 M58 53h-7 M102 53h7"/></g>
<path d="M38 82 L62 60 L78 77 L95 57 L122 83 V96 Q109 117 80 132 Q51 117 38 96Z" fill="#0879dc"/>
<path d="M38 88 L62 66 L78 82 L95 63 L122 89 V96 Q109 117 80 132 Q51 117 38 96Z" fill="#075fba"/>
<path d="M43 90 L62 75 L78 91 L95 72 L117 94" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
<path d="M52 113 C64 104 71 109 80 99 S99 93 107 85" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
<path d="M78 99 L78 87 L91 87 L91 99Z" fill="#fff"/><path d="M75 87 L84.5 79 L94 87Z" fill="#fff"/>
</svg><h1>Destino Seguro</h1><p>Tu ruta segura, siempre</p></header>
<nav class="menu"><button onclick="mostrar('inicio')">🏠 Inicio</button><button onclick="mostrar('mapa')">🗺️ Mapa</button><button onclick="mostrar('rutas')">🚶 Rutas seguras</button><button onclick="mostrar('zonas')">⚠️ Zonas de riesgo</button><button onclick="mostrar('refugios')">🏡 Refugios</button><button onclick="mostrar('consejos')">💡 Consejos</button></nav>
<main id="contenido"></main><footer>Destino Seguro · Cuida de ti y tu familia</footer></div>
<script>
let marcas=[],canvas=null,ctx=null;
const colores={verde:"#179c59",rojo:"#dc3d46",azul:"#2378dc",amarillo:"#e5a800"};
function mostrar(p){
const c=document.getElementById("contenido");
if(p==="inicio"){c.innerHTML=`<section class="hero"><span class="eyebrow">🛡️ PREPÁRATE · UBÍCATE · PROTÉGETE</span><h2>¡Hola! Bienvenido a Destino Seguro</h2><p>Una guía escolar para reconocer posibles riesgos y planificar con tu familia durante lluvias intensas y emergencias.</p><button class="principal" onclick="mostrar('mapa')">Explorar mapa →</button></section><h2>¿Qué necesitas hoy?</h2><div class="tarjetas-inicio"><button class="acceso" onclick="mostrar('mapa')"><span>🗺️</span><b>Mapa interactivo</b><small>Marca lugares en La Esperanza</small></button><button class="acceso" onclick="mostrar('rutas')"><span>🚶</span><b>Rutas seguras</b><small>Consejos para planificar recorridos</small></button><button class="acceso" onclick="mostrar('zonas')"><span>⚠️</span><b>Zonas de riesgo</b><small>Aprende qué lugares evitar</small></button><button class="acceso" onclick="mostrar('refugios')"><span>🏠</span><b>Refugios</b><small>Comprueba lugares habilitados</small></button></div><div class="notice"><b>Importante:</b> este prototipo no es un sistema oficial de emergencias. Confirma la información con las autoridades locales.</div>`;return;}
if(p==="mapa"){c.innerHTML=`<div class="section-heading"><div><span class="eyebrow">EXPLORA TU COMUNIDAD</span><h2>Mapa de La Esperanza</h2></div><span style="font-size:32px">📍</span></div><p class="muted">Mapa esquemático de demostración; no muestra calles reales.</p><div class="legend"><span><i class="dot green"></i> Zona segura*</span><span><i class="dot red"></i> Zona de riesgo*</span><span><i class="dot blue"></i> Refugio*</span><span><i class="dot yellow"></i> Encuentro</span></div><div class="controles"><label for="tipoMarca">Tipo de marca</label><select id="tipoMarca"><option value="verde">🟢 Zona segura por verificar</option><option value="rojo">🔴 Posible zona de riesgo</option><option value="azul">🔵 Refugio por verificar</option><option value="amarillo">🟡 Punto de encuentro</option></select><button class="secondary" onclick="borrarMarcas()">🗑️ Borrar todas las marcas</button></div><p><b>Instrucciones:</b> toca cualquier parte del plano para agregar una marca y escribe una descripción.</p><canvas id="mapaCanvas" width="700" height="430"></canvas><p id="contador" class="muted">Marcas colocadas: ${marcas.length}</p><div class="notice"><b>*Por verificar:</b> las marcas no certifican que un lugar sea seguro o peligroso. Se mantienen mientras no recargues esta página.</div>`;iniciarPlano();return;}
const paginas={
rutas:`<h2>🚶 Rutas seguras</h2><div class="tarjeta verde"><b>1. Revisa el camino</b><p>Consulta si la vía está transitable y revisa avisos oficiales.</p></div><div class="tarjeta rojo"><b>2. No cruces agua en movimiento</b><p>Evita calles inundadas, quebradas y puentes dañados.</p></div><div class="tarjeta"><b>3. Avisa a tu familia</b><p>Comparte adónde vas y acuerda una ruta alternativa con una persona adulta.</p></div><button class="principal" onclick="mostrar('mapa')">Abrir mapa →</button>`,
zonas:`<h2>⚠️ Zonas de riesgo</h2><div class="tarjeta rojo"><b>🌊 Calles inundadas</b><p>No atravieses agua acumulada ni corrientes.</p></div><div class="tarjeta rojo"><b>⛰️ Quebradas y laderas</b><p>Aléjate de cauces y zonas con señales de deslizamiento.</p></div><div class="tarjeta rojo"><b>🚧 Vías dañadas</b><p>No pases por calles cerradas o puentes dañados.</p></div><button class="principal" onclick="mostrar('mapa')">Añadir una marca al mapa →</button>`,
refugios:`<h2>🏠 Refugios y lugares seguros</h2><div class="tarjeta"><b>Refugios habilitados</b><p>Consulta a la municipalidad o Defensa Civil cuáles están abiertos.</p></div><div class="tarjeta"><b>Punto de encuentro familiar</b><p>Acuerda un lugar conocido, accesible y lejos de zonas inundables.</p></div><div class="notice">No se incluyen direcciones porque deben confirmarse localmente.</div><button class="principal" onclick="mostrar('mapa')">Marcar un lugar →</button>`,
consejos:`<h2>💡 Consejos</h2><div class="tarjeta verde">✅ Sigue las indicaciones de las autoridades.</div><div class="tarjeta verde">✅ Acuerda un punto de encuentro con tu familia.</div><div class="tarjeta verde">✅ Mantén el teléfono cargado si es posible.</div><div class="tarjeta verde">✅ No cruces corrientes de agua ni calles inundadas.</div><div class="tarjeta verde">✅ Si ves peligro, aléjate y avisa a una persona adulta.</div>`};
c.innerHTML=paginas[p]||paginas.inicio;
}
function iniciarPlano(){canvas=document.getElementById("mapaCanvas");if(!canvas)return;ctx=canvas.getContext("2d");canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height,tipo=document.getElementById("tipoMarca").value,nombre=prompt("Escribe el nombre o descripción del lugar:");if(!nombre||!nombre.trim())return;marcas.push({x,y,tipo,nombre:nombre.trim()});dibujarPlano();};dibujarPlano();}
function dibujarPlano(){if(!ctx||!canvas)return;const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle="#edf4e8";ctx.fillRect(0,0,w,h);ctx.strokeStyle="#d3dfcf";ctx.lineWidth=1;for(let x=20;x<w;x+=35){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}for(let y=20;y<h;y+=35){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}const calles=[[0,95,w,95],[0,215,w,215],[0,335,w,335],[100,0,100,h],[300,0,300,h],[510,0,510,h],[650,0,650,h]];ctx.strokeStyle="#fff";ctx.lineWidth=17;calles.forEach(a=>{ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(a[2],a[3]);ctx.stroke();});ctx.strokeStyle="#c7d5e4";ctx.lineWidth=2;calles.forEach(a=>{ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(a[2],a[3]);ctx.stroke();});ctx.fillStyle="#526982";ctx.font="bold 15px Arial";ctx.fillText("LA ESPERANZA · MAPA ESQUEMÁTICO",18,25);ctx.font="12px Arial";ctx.fillText("Calles ilustrativas — no usar para navegación",18,44);marcas.forEach(m=>{ctx.beginPath();ctx.fillStyle=colores[m.tipo];ctx.arc(m.x,m.y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle="#19324d";ctx.font="12px Arial";ctx.fillText(m.nombre.length>18?m.nombre.slice(0,18)+"…":m.nombre,Math.min(m.x+13,w-150),m.y-12);});const n=document.getElementById("contador");if(n)n.textContent="Marcas colocadas: "+marcas.length;}
function borrarMarcas(){marcas=[];dibujarPlano();}
mostrar("inicio");
</script></body></html>
